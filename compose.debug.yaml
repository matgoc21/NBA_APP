services:
  nbaapp:
    image: nbaapp
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 backend/manage.py runserver 0.0.0.0:5432 --nothreading --noreload"]
    ports:
      - 5432:5432
      - 5678:5678
