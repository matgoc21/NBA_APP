version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nba_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: nba_redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
